name: Build HugzzBotzX V7.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify tools
        run: |
          java -version
          gradle --version
          adb version
          sdkmanager --list_installed

      - name: Validate Android resources
        run: |
          test -f app/src/main/res/drawable-nodpi/hugzzbotzx_logo.png
          test -f app/src/main/res/drawable/button.xml
          test -f app/src/main/res/drawable/button_pink.xml
          test -f app/src/main/res/drawable/panel.xml

      - name: V7 source checks
        run: |
          test -f app/src/main/java/com/hugzzbotzx/app/ReminderReceiver.java
          test -f app/src/main/java/com/hugzzbotzx/app/SecretVault.java
          grep -q 'READ_MEDIA_IMAGES' app/src/main/AndroidManifest.xml
          grep -q 'V7.0' app/src/main/java/com/hugzzbotzx/app/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HugzzBotzX-V7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
